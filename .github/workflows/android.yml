name: Android build and row 01 tests
on:
  push:
    branches: [main, feat/sai-pleos-android]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sai-row01-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_c
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1024x552
            adb shell wm density 160
            ./gradlew connectedDebugAndroidTest
            adb pull /sdcard/Download/sai-screenshots app/build/reports/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sai-row01-test-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
